<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Harish Battle Royale</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
    color:white;
    text-shadow:0 2px 5px #000;
}

#top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    font-size:18px;
}

#healthBox{
    position:absolute;
    left:20px;
    bottom:25px;
    width:240px;
}

#healthBG{
    height:20px;
    background:rgba(0,0,0,.7);
    border:2px solid white;
    border-radius:10px;
    overflow:hidden;
}

#health{
    height:100%;
    width:100%;
    background:#20d45b;
}

#armor{
    height:8px;
    width:100%;
    margin-top:5px;
    background:#27a8ff;
    border-radius:5px;
}

#ammo{
    position:absolute;
    right:25px;
    bottom:25px;
    font-size:30px;
    font-weight:bold;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
}

/* ================= START ================= */

.screen{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;
    background:
    radial-gradient(
        circle,
        rgba(30,50,70,.3),
        rgba(0,0,0,.95)
    );
}

.screen h1{
    font-size:clamp(35px,7vw,75px);
    letter-spacing:3px;
}

.screen p{
    margin-top:10px;
    opacity:.8;
}

.mainButton{
    margin-top:25px;
    padding:17px 50px;
    border:0;
    border-radius:12px;
    background:#ffb300;
    font-size:20px;
    font-weight:bold;
}

/* ================= MOBILE ================= */

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
}

/* LEFT MOVEMENT JOYSTICK */

#moveJoystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    border:2px solid rgba(255,255,255,.5);
    pointer-events:auto;
}

#moveStick{
    position:absolute;
    left:45px;
    top:45px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
}

/* RIGHT AIM JOYSTICK */

#aimJoystick{
    position:absolute;
    right:25px;
    bottom:30px;
    width:145px;
    height:145px;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    border:2px solid rgba(255,255,255,.5);
    pointer-events:auto;
}

#aimStick{
    position:absolute;
    left:45px;
    top:45px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
}

/* SHOOT */

#shootButton{
    position:absolute;
    right:55px;
    bottom:205px;

    width:90px;
    height:90px;

    border-radius:50%;
    border:3px solid rgba(255,255,255,.7);

    background:rgba(210,30,30,.75);

    color:white;
    font-size:34px;

    pointer-events:auto;
}

/* RELOAD */

#reloadButton{
    position:absolute;
    right:165px;
    bottom:210px;

    width:60px;
    height:60px;

    border-radius:50%;
    border:2px solid white;

    background:rgba(0,0,0,.5);

    color:white;
    font-size:24px;

    pointer-events:auto;
}

@media(max-width:800px){

    #mobileControls{
        display:block;
    }

    #top{
        font-size:14px;
    }

    #ammo{
        font-size:22px;
    }

    #healthBox{
        width:180px;
    }
}

</style>
</head>

<body>


<!-- ================= HUD ================= -->

<div id="hud">

    <div id="top">

        <div>
            ALIVE:
            <span id="alive">16</span>
        </div>

        <div>
            KILLS:
            <span id="kills">0</span>
        </div>

        <div>
            ZONE:
            <span id="zonePercent">100</span>%
        </div>

    </div>

    <div id="crosshair">+</div>

    <div id="healthBox">

        HP

        <div id="healthBG">
            <div id="health"></div>
        </div>

        <div id="armor"></div>

    </div>

    <div id="ammo">
        <span id="magazine">30</span>
        /
        <span id="reserve">120</span>
    </div>

</div>


<!-- ================= START ================= -->

<div id="startScreen" class="screen">

    <h1>HARISH BATTLE ROYALE</h1>

    <p>REALISTIC 3D BATTLE ARENA</p>

    <p>
        PC: WASD + Mouse + Left Click
    </p>

    <p>
        Mobile: Left Joystick = Move |
        Right Joystick = Aim |
        Red Button = Shoot
    </p>

    <button
        class="mainButton"
        id="startButton">
        START BATTLE
    </button>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOver" class="screen" style="display:none">

    <h1>GAME OVER</h1>

    <p>
        Kills:
        <span id="finalKills">0</span>
    </p>

    <button
        class="mainButton"
        onclick="location.reload()">
        PLAY AGAIN
    </button>

</div>


<!-- ================= MOBILE CONTROLS ================= -->

<div id="mobileControls">

    <!-- MOVEMENT -->

    <div id="moveJoystick">
        <div id="moveStick"></div>
    </div>


    <!-- AIM -->

    <div id="aimJoystick">
        <div id="aimStick"></div>
    </div>


    <!-- SHOOT -->

    <button id="shootButton">
        🔫
    </button>


    <!-- RELOAD -->

    <button id="reloadButton">
        ↻
    </button>

</div>


<script type="importmap">

{
    "imports":{

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

    }
}

</script>


<script type="module">

import * as THREE from "three";


/* =========================================================
   GAME VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let player;

let enemies=[];
let bullets=[];

let gameStarted=false;
let gameOver=false;

let health=100;
let armor=100;

let kills=0;

let magazine=30;
let reserveAmmo=120;

let lastShot=0;

let playerSpeed=.17;

let zoneRadius=50;


/* KEYBOARD */

const keys={};


/* MOBILE JOYSTICKS */

const movement={
    x:0,
    y:0
};

const aim={
    x:0,
    y:0
};


/* CAMERA */

let cameraYaw=0;
let cameraPitch=.15;


/* =========================================================
   INITIALIZE
========================================================= */

function init(){

    scene=new THREE.Scene();


    scene.background=
        new THREE.Color(
            0x91cbed
        );


    scene.fog=
        new THREE.Fog(
            0x91cbed,
            45,
            180
        );


    camera=
        new THREE.PerspectiveCamera(
            65,
            innerWidth/innerHeight,
            .1,
            500
        );


    renderer=
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
            "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;


    renderer.outputColorSpace=
        THREE.SRGBColorSpace;


    document.body.appendChild(
        renderer.domElement
    );


    createLighting();

    createGround();

    createRoad();

    createBuildings();

    createTrees();

    createPlayer();

    createEnemies();

    createZone();


    setupKeyboard();

    setupMouse();

    setupMobile();

    window.addEventListener(
        "resize",
        resize
    );


    render();
}


/* =========================================================
   LIGHTING
========================================================= */

function createLighting(){

    const sky=
        new THREE.HemisphereLight(
            0xdff4ff,
            0x35502b,
            2
        );

    scene.add(sky);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            3
        );


    sun.position.set(
        -50,
        80,
        30
    );


    sun.castShadow=true;


    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;


    sun.shadow.camera.left=-100;
    sun.shadow.camera.right=100;
    sun.shadow.camera.top=100;
    sun.shadow.camera.bottom=-100;


    scene.add(sun);
}


/* =========================================================
   GROUND
========================================================= */

function createGround(){

    const ground=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                130,
                130,
                50,
                50
            ),

            new THREE.MeshStandardMaterial({

                color:0x477a3d,

                roughness:.95

            })

        );


    ground.rotation.x=
        -Math.PI/2;


    ground.receiveShadow=true;


    scene.add(ground);


    const water=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                300
            ),

            new THREE.MeshStandardMaterial({

                color:0x147ca5,

                roughness:.2

            })

        );


    water.rotation.x=
        -Math.PI/2;


    water.position.y=-.2;


    scene.add(water);
}


/* =========================================================
   ROAD
========================================================= */

function createRoad(){

    const roadMaterial=
        new THREE.MeshStandardMaterial({

            color:0x292b2d,

            roughness:.9

        });


    const road=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                15,
                .12,
                125
            ),

            roadMaterial

        );


    road.position.y=.04;


    scene.add(road);


    const lineMaterial=
        new THREE.MeshBasicMaterial({

            color:0xffffff

        });


    for(
        let z=-60;
        z<60;
        z+=8
    ){

        const line=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .25,
                    .05,
                    4
                ),

                lineMaterial

            );


        line.position.set(
            0,
            .13,
            z
        );


        scene.add(line);
    }
}


/* =========================================================
   BUILDINGS
========================================================= */

function createBuildings(){

    for(
        let i=0;
        i<35;
        i++
    ){

        const x=
            (Math.random()-.5)*110;


        const z=
            (Math.random()-.5)*110;


        if(
            Math.abs(x)<15 ||
            Math.abs(z)<10
        ){
            continue;
        }


        const width=
            5+
            Math.random()*7;


        const depth=
            5+
            Math.random()*7;


        const height=
            4+
            Math.random()*15;


        const material=
            new THREE.MeshStandardMaterial({

                color:
                    new THREE.Color(

                        .25+
                        Math.random()*.25,

                        .28+
                        Math.random()*.25,

                        .30+
                        Math.random()*.25

                    ),

                roughness:.7

            });


        const building=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                ),

                material

            );


        building.position.set(
            x,
            height/2,
            z
        );


        building.castShadow=true;

        building.receiveShadow=true;


        scene.add(building);
    }
}


/* =========================================================
   TREES
========================================================= */

function createTrees(){

    for(
        let i=0;
        i<60;
        i++
    ){

        const x=
            (Math.random()-.5)*110;


        const z=
            (Math.random()-.5)*110;


        if(
            Math.abs(x)<15 ||
            Math.abs(z)<10
        ){
            continue;
        }


        const tree=
            new THREE.Group();


        const trunk=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .25,
                    .35,
                    2.5,
                    8
                ),

                new THREE.MeshStandardMaterial({

                    color:0x67442b

                })

            );


        trunk.position.y=1.25;


        const leaves=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1.7,
                    12,
                    12
                ),

                new THREE.MeshStandardMaterial({

                    color:0x195b28,

                    roughness:.9

                })

            );


        leaves.position.y=3.2;


        tree.add(
            trunk,
            leaves
        );


        tree.position.set(
            x,
            0,
            z
        );


        tree.castShadow=true;


        scene.add(tree);
    }
}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

    player=
        new THREE.Group();


    const skin=
        new THREE.MeshStandardMaterial({

            color:0xb97858,

            roughness:.8

        });


    const shirt=
        new THREE.MeshStandardMaterial({

            color:0x24364b,

            roughness:.7

        });


    const pants=
        new THREE.MeshStandardMaterial({

            color:0x161a1e,

            roughness:.8

        });


    const body=
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .43,
                .85,
                8,
                16
            ),

            shirt

        );


    body.position.y=1.35;

    body.castShadow=true;


    const head=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .38,
                24,
                24
            ),

            skin

        );


    head.position.y=2.35;

    head.castShadow=true;


    const leg1=
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .18,
                .75,
                8,
                12
            ),

            pants

        );


    leg1.position.set(
        -.2,
        .55,
        0
    );


    const leg2=
        leg1.clone();


    leg2.position.x=.2;


    player.add(
        body,
        head,
        leg1,
        leg2
    );


    player.position.set(
        0,
        0,
        25
    );


    scene.add(player);
}


/* =========================================================
   ENEMIES
========================================================= */

function createEnemies(){

    for(
        let i=0;
        i<15;
        i++
    ){

        createEnemy();
    }
}


function createEnemy(){

    const enemy=
        new THREE.Group();


    const skin=
        new THREE.MeshStandardMaterial({

            color:0xb97558,

            roughness:.8

        });


    const clothes=
        new THREE.MeshStandardMaterial({

            color:
                new THREE.Color(

                    .15+
                    Math.random()*.35,

                    .18+
                    Math.random()*.3,

                    .2+
                    Math.random()*.3

                ),

            roughness:.7

        });


    const body=
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .43,
                .85,
                8,
                16
            ),

            clothes

        );


    body.position.y=1.35;


    const head=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .38,
                20,
                20
            ),

            skin

        );


    head.position.y=2.35;


    enemy.add(
        body,
        head
    );


    let x;
    let z;


    do{

        x=
            (Math.random()-.5)*100;

        z=
            (Math.random()-.5)*100;

    }while(
        Math.hypot(
            x-player.position.x,
            z-player.position.z
        )<18
    );


    enemy.position.set(
        x,
        0,
        z
    );


    enemy.userData.hp=100;


    scene.add(enemy);

    enemies.push(enemy);
}


/* =========================================================
   KEYBOARD MOVEMENT
========================================================= */

function setupKeyboard(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[e.key.toLowerCase()]=true;


            if(
                e.key.toLowerCase()==="r"
            ){

                reload();
            }
        }
    );


    window.addEventListener(
        "keyup",
        e=>{

            keys[e.key.toLowerCase()]=false;
        }
    );
}


/* =========================================================
   MOUSE AIM + SHOOT
========================================================= */

function setupMouse(){

    renderer.domElement.addEventListener(
        "click",
        ()=>{

            if(
                gameStarted &&
                document.pointerLockElement !==
                renderer.domElement
            ){

                renderer.domElement.requestPointerLock();
            }
        }
    );


    window.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                cameraYaw -=
                    e.movementX*.0025;

                cameraPitch -=
                    e.movementY*.0015;


                cameraPitch=
                    THREE.MathUtils.clamp(
                        cameraPitch,
                        -.5,
                        .7
                    );
            }
        }
    );


    renderer.domElement.addEventListener(
        "mousedown",
        e=>{

            if(e.button===0){

                shoot();
            }
        }
    );
}


/* =========================================================
   MOBILE JOYSTICK SYSTEM
========================================================= */

function setupMobile(){

    setupJoystick(
        "moveJoystick",
        "moveStick",
        movement
    );


    setupJoystick(
        "aimJoystick",
        "aimStick",
        aim
    );


    const shootButton=
        document.getElementById(
            "shootButton"
        );


    shootButton.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            shoot();
        }
    );


    const reloadButton=
        document.getElementById(
            "reloadButton"
        );


    reloadButton.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            reload();
        }
    );
}


function setupJoystick(
    baseId,
    stickId,
    output
){

    const base=
        document.getElementById(
            baseId
        );


    const stick=
        document.getElementById(
            stickId
        );


    let active=false;

    let pointerId=null;


    base.addEventListener(
        "pointerdown",
        e=>{

            active=true;

            pointerId=e.pointerId;

            base.setPointerCapture(
                pointerId
            );

            updateJoystick(
                e
            );
        }
    );


    base.addEventListener(
        "pointermove",
        e=>{

            if(
                active &&
                e.pointerId===pointerId
            ){

                updateJoystick(
                    e
                );
            }
        }
    );


    base.addEventListener(
        "pointerup",
        reset
    );


    base.addEventListener(
        "pointercancel",
        reset
    );


    function updateJoystick(e){

        const rect=
            base.getBoundingClientRect();


        const centerX=
            rect.left+
            rect.width/2;


        const centerY=
            rect.top+
            rect.height/2;


        let dx=
            e.clientX-centerX;


        let dy=
            e.clientY-centerY;


        const max=
            rect.width*.34;


        const distance=
            Math.hypot(
                dx,
                dy
            );


        if(
            distance>max
        ){

            dx=
                dx/distance*max;

            dy=
                dy/distance*max;
        }


        stick.style.transform=
            `translate(${dx}px,${dy}px)`;


        output.x=
            dx/max;

        output.y=
            dy/max;
    }


    function reset(){

        active=false;

        pointerId=null;

        output.x=0;

        output.y=0;

        stick.style.transform=
            "translate(0px,0px)";
    }
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    if(
        !gameStarted ||
        gameOver
    ){
        return;
    }


    let forward=0;
    let sideways=0;


    /* PC */

    if(keys.w)
        forward+=1;

    if(keys.s)
        forward-=1;

    if(keys.a)
        sideways-=1;

    if(keys.d)
        sideways+=1;


    /* MOBILE */

    forward +=
        -movement.y;

    sideways +=
        movement.x;


    const length=
        Math.hypot(
            forward,
            sideways
        );


    if(length>.05){

        forward/=length;

        sideways/=length;


        /*
          Movement follows camera direction.
        */

        const sin=
            Math.sin(cameraYaw);

        const cos=
            Math.cos(cameraYaw);


        player.position.x +=
            (
                sideways*cos+
                forward*sin
            )*playerSpeed;


        player.position.z +=
            (
                -sideways*sin+
                forward*cos
            )*playerSpeed;
    }


    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -57,
            57
        );


    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -57,
            57
        );
}


/* =========================================================
   CAMERA / AIM
========================================================= */

function updateAim(){

    /*
      Mobile right joystick controls
      ONLY camera direction.
    */

    if(
        Math.abs(aim.x)>.05 ||
        Math.abs(aim.y)>.05
    ){

        cameraYaw -=
            aim.x*.035;


        cameraPitch -=
            aim.y*.025;


        cameraPitch=
            THREE.MathUtils.clamp(
                cameraPitch,
                -.5,
                .7
            );
    }


    const distance=6;

    const height=3.4;


    const offsetX=
        Math.sin(cameraYaw)*
        distance;


    const offsetZ=
        Math.cos(cameraYaw)*
        distance;


    camera.position.set(

        player.position.x+
        offsetX,

        player.position.y+
        height,

        player.position.z+
        offsetZ

    );


    camera.lookAt(

        player.position.x,

        player.position.y+
        1.4+

        cameraPitch*3,

        player.position.z

    );
}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

    if(
        !gameStarted ||
        gameOver
    ){
        return;
    }


    const now=
        performance.now();


    if(
        now-lastShot<
        140
    ){
        return;
    }


    if(
        magazine<=0
    ){

        reload();

        return;
    }


    magazine--;

    lastShot=now;


    /*
      Bullet goes exactly toward
      the center of the screen.
    */

    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .06,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xffe06b
            })

        );


    bullet.position.copy(
        camera.position
    );


    bullet.userData.velocity=
        direction.multiplyScalar(
            1.8
        );


    bullet.userData.life=100;


    scene.add(bullet);

    bullets.push(bullet);


    updateHUD();
}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

    if(
        magazine>=30 ||
        reserveAmmo<=0
    ){
        return;
    }


    const amount=
        Math.min(
            30-magazine,
            reserveAmmo
        );


    magazine+=amount;

    reserveAmmo-=amount;


    updateHUD();
}


/* =========================================================
   BULLET UPDATE
========================================================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const bullet=
            bullets[i];


        bullet.position.add(
            bullet.userData.velocity
        );


        bullet.userData.life--;


        let removed=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const enemy=
                enemies[j];


            const target=
                enemy.position.clone();


            target.y+=1.2;


            if(
                bullet.position.distanceTo(
                    target
                )<1.1
            ){

                enemy.userData.hp-=35;


                scene.remove(
                    bullet
                );


                bullets.splice(
                    i,
                    1
                );


                removed=true;


                if(
                    enemy.userData.hp<=0
                ){

                    scene.remove(
                        enemy
                    );


                    enemies.splice(
                        j,
                        1
                    );


                    kills++;


                    setTimeout(
                        createEnemy,
                        1200
                    );
                }


                break;
            }
        }


        if(
            !removed &&
            bullet.userData.life<=0
        ){

            scene.remove(
                bullet
            );


            bullets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

    enemies.forEach(
        enemy=>{

            const dx=
                player.position.x-
                enemy.position.x;


            const dz=
                player.position.z-
                enemy.position.z;


            const distance=
                Math.hypot(
                    dx,
                    dz
                );


            if(
                distance>6
            ){

                enemy.position.x+=
                    dx/distance*.018;

                enemy.position.z+=
                    dz/distance*.018;

            }
            else{

                if(
                    Math.random()<.025
                ){

                    damagePlayer(
                        3
                    );
                }
            }


            enemy.lookAt(
                player.position.x,
                1,
                player.position.z
            );
        }
    );
}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(
    amount
){

    if(gameOver)
        return;


    if(
        armor>0
    ){

        const absorbed=
            Math.min(
                armor,
                amount*.7
            );


        armor-=absorbed;

        amount-=absorbed;
    }


    health-=amount;


    if(
        health<=0
    ){

        health=0;

        endGame();
    }


    updateHUD();
}


/* =========================================================
   SAFE ZONE
========================================================= */

let zoneMesh;


function createZone(){

    const geometry=
        new THREE.RingGeometry(
            0.98,
            1,
            96
        );


    const material=
        new THREE.MeshBasicMaterial({

            color:0x24b9ff,

            transparent:true,

            opacity:.3,

            side:
            THREE.DoubleSide

        });


    zoneMesh=
        new THREE.Mesh(
            geometry,
            material
        );


    zoneMesh.rotation.x=
        -Math.PI/2;


    zoneMesh.position.y=.08;


    scene.add(zoneMesh);
}


function updateZone(){

    if(
        zoneRadius>18
    ){

        zoneRadius-=.003;
    }


    zoneMesh.scale.set(
        zoneRadius,
        zoneRadius,
        zoneRadius
    );


    const distance=
        Math.hypot(
            player.position.x,
            player.position.z
        );


    if(
        distance>zoneRadius
    ){

        damagePlayer(
            .03
        );
    }


    document.getElementById(
        "zonePercent"
    ).textContent=
        Math.round(
            zoneRadius/50*100
        );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "health"
    ).style.width=
        Math.max(
            0,
            health
        )+"%";


    document.getElementById(
        "armor"
    ).style.width=
        Math.max(
            0,
            armor
        )+"%";


    document.getElementById(
        "magazine"
    ).textContent=
        magazine;


    document.getElementById(
        "reserve"
    ).textContent=
        reserveAmmo;


    document.getElementById(
        "kills"
    ).textContent=
        kills;


    document.getElementById(
        "alive"
    ).textContent=
        enemies.length+1;
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    gameOver=true;

    gameStarted=false;


    document.getElementById(
        "finalKills"
    ).textContent=
        kills;


    document.getElementById(
        "gameOver"
    ).style.display=
        "flex";
}


/* =========================================================
   START
========================================================= */

document.getElementById(
    "startButton"
).onclick=()=>{

    gameStarted=true;


    document.getElementById(
        "startScreen"
    ).style.display=
        "none";
};


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =========================================================
   RENDER LOOP
========================================================= */

function render(){

    requestAnimationFrame(
        render
    );


    if(
        gameStarted &&
        !gameOver
    ){

        updatePlayer();

        updateAim();

        updateEnemies();

        updateBullets();

        updateZone();

        updateHUD();
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START ENGINE
========================================================= */

init();

</script>

</body>
</html>
