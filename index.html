<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harish Car Racing Game 9571</title><style>html,body{margin:0;height:100%;overflow:hidden;font-family:Arial}#hud{position:fixed;z-index:2;top:10px;left:10px;color:#fff;background:#0008;padding:10px;border-radius:10px}#start{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#0008}.box{background:#fff;padding:25px;border-radius:18px;text-align:center}button{padding:14px 24px;border:0;border-radius:12px;font-weight:bold}#controls{position:fixed;z-index:2;bottom:20px;left:0;right:0;display:flex;justify-content:space-around;pointer-events:none}.c{pointer-events:auto;width:70px;height:70px;border-radius:50%;border:0;background:#fffc;font-size:25px}</style></head><body><div id="hud">Speed: <b id="speed">0</b> km/h<br>Score: <b id="score">0</b></div><div id="start"><div class="box"><h1>🏁 Harish Car Racing Game 9571</h1><p>3D highway racing</p><button onclick="startGame()">START RACE</button></div></div><div id="controls"><button class="c" onpointerdown="left=1" onpointerup="left=0">◀</button><button class="c" onpointerdown="gas=1" onpointerup="gas=0">▲</button><button class="c" onpointerdown="right=1" onpointerup="right=0">▶</button></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,80,350);const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);cam.position.set(0,5,12);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.shadowMap.enabled=true;document.body.appendChild(r.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x557744,1.7));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-50,100,50);sun.castShadow=true;scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.7});const ground=new THREE.Mesh(new THREE.PlaneGeometry(700,700),mat(0x4d8a45));ground.rotation.x=-Math.PI/2;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,700),mat(0x303236));road.rotation.x=-Math.PI/2;scene.add(road);
for(let z=-340;z<340;z+=14)for(const x of[-3,3]){const m=new THREE.Mesh(new THREE.BoxGeometry(.15,.03,6),mat(0xffffff));m.position.set(x,.04,z);scene.add(m)}
function car(color){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(2,0.65,4),mat(color));b.position.y=.6;g.add(b);const cab=new THREE.Mesh(new THREE.BoxGeometry(1.5,.6,1.8),mat(0x202833));cab.position.y=1.05;g.add(cab);return g}const player=car(0xd71920);player.position.z=7;scene.add(player);const traffic=[];function spawn(){const c=car([0x1565c0,0xf4c20d,0xffffff,0x20a050][Math.random()*4|0]);c.position.set([-6,-3,3,6][Math.random()*4|0],0,-120-Math.random()*120);scene.add(c);traffic.push(c)}
for(let z=-330;z<120;z+=18)for(const x of[-13,13]){const t=new THREE.Mesh(new THREE.ConeGeometry(1.4,3.5,8),mat(0x226b2d));t.position.set(x,1.75,z+Math.random()*8);scene.add(t)}
let running=false,left=0,right=0,gas=0,speed=0,score=0,last=performance.now(),sp=0;const keys={};onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;window.startGame=()=>{document.getElementById('start').style.display='none';running=true};function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(running){if(gas||keys.w||keys.ArrowUp)speed+=45*dt;else speed-=10*dt;speed=Math.max(0,Math.min(140,speed));let s=(right||keys.d||keys.ArrowRight?1:0)-(left||keys.a||keys.ArrowLeft?1:0);player.position.x+=s*(3+speed*.025)*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-7,7);scene.traverse(o=>{if(o!==player&&o.isMesh&&o.geometry?.parameters?.depth===6)o.position.z+=speed*dt;if(o.position?.z>30&&o.geometry?.parameters?.depth===6)o.position.z-=680});for(const c of traffic){c.position.z+=(speed*.7+25)*dt;if(Math.abs(c.position.x-player.position.x)<1.8&&Math.abs(c.position.z-player.position.z)<3){alert('Game Over! Score: '+Math.floor(score));location.reload()}}sp-=dt;if(sp<0){spawn();sp=1+Math.random()}for(let i=traffic.length-1;i>=0;i--)if(traffic[i].position.z>30){scene.remove(traffic[i]);traffic.splice(i,1)}score+=speed*dt*.1;cam.position.x+=(player.position.x-cam.position.x)*.08;cam.lookAt(player.position.x,1,-15);document.getElementById('speed').textContent=Math.round(speed);document.getElementById('score').textContent=Math.floor(score)}r.render(scene,cam)}requestAnimationFrame(loop);onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};
</script></body></html>
