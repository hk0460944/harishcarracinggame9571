<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Harish Battle Royale</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    z-index:10;
}

.top{
    position:absolute;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    font-size:18px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#healthPanel{
    position:absolute;
    left:18px;
    bottom:25px;
    width:260px;
}

#healthBack{
    width:100%;
    height:20px;
    background:rgba(0,0,0,.7);
    border:2px solid white;
    border-radius:10px;
    overflow:hidden;
}

#health{
    height:100%;
    width:100%;
    background:#22d45b;
}

#armor{
    margin-top:5px;
    height:10px;
    width:80%;
    background:#30a9ff;
    border-radius:5px;
}

#ammo{
    position:absolute;
    right:25px;
    bottom:25px;
    font-size:30px;
    font-weight:bold;
    text-shadow:0 2px 5px #000;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    font-size:30px;
    font-weight:bold;
    text-shadow:0 0 5px #000;
}

#mini{
    position:absolute;
    right:18px;
    top:55px;
    width:150px;
    height:150px;
    border:3px solid white;
    border-radius:50%;
    background:rgba(20,60,20,.65);
    overflow:hidden;
}

#zone{
    position:absolute;
    inset:18px;
    border:2px solid #37bfff;
    border-radius:50%;
}

#start,
#gameover{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    text-align:center;
    background:
      radial-gradient(
        circle at center,
        rgba(20,40,60,.35),
        rgba(0,0,0,.92)
      );
}

#gameover{
    display:none;
}

h1{
    font-size:clamp(36px,7vw,76px);
    letter-spacing:3px;
    text-shadow:0 5px 20px #000;
}

.subtitle{
    margin:10px;
    opacity:.85;
    font-size:18px;
}

.mainButton{
    margin-top:25px;
    padding:17px 50px;
    border:0;
    border-radius:12px;
    font-size:21px;
    font-weight:bold;
    cursor:pointer;
    background:#ffb300;
}

#mobileControls{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    pointer-events:none;
}

.mobileButton{
    position:absolute;
    width:72px;
    height:72px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.6);
    background:rgba(0,0,0,.4);
    color:white;
    font-size:28px;
    pointer-events:auto;
}

#left{
    left:20px;
    bottom:90px;
}

#right{
    left:180px;
    bottom:90px;
}

#forward{
    left:100px;
    bottom:165px;
}

#back{
    left:100px;
    bottom:15px;
}

#fire{
    right:25px;
    bottom:65px;
    width:95px;
    height:95px;
    background:rgba(190,20,20,.65);
}

@media(max-width:800px){
    #mobileControls{
        display:block;
    }

    #ammo{
        font-size:22px;
    }

    #healthPanel{
        width:180px;
    }
}
</style>
</head>

<body>

<div id="hud">

    <div class="top">
        <div>
            ALIVE:
            <span id="alive">20</span>
        </div>

        <div>
            KILLS:
            <span id="kills">0</span>
        </div>

        <div>
            ZONE:
            <span id="zoneText">100%</span>
        </div>
    </div>

    <div id="crosshair">+</div>

    <div id="mini">
        <div id="zone"></div>
    </div>

    <div id="healthPanel">
        <div>HP</div>
        <div id="healthBack">
            <div id="health"></div>
        </div>
        <div id="armor"></div>
    </div>

    <div id="ammo">
        <span id="mag">30</span> / 120
    </div>

</div>


<div id="start">

    <h1>HARISH BATTLE ROYALE</h1>

    <div class="subtitle">
        NEXT-GENERATION 3D BATTLE ARENA
    </div>

    <div class="subtitle">
        WASD = Move &nbsp; | &nbsp;
        Mouse = Aim &nbsp; | &nbsp;
        Click = Fire
    </div>

    <button class="mainButton" id="startButton">
        ENTER BATTLE
    </button>

</div>


<div id="gameover">

    <h1>BATTLE OVER</h1>

    <div class="subtitle">
        Kills:
        <span id="finalKills">0</span>
    </div>

    <button class="mainButton" id="restart">
        PLAY AGAIN
    </button>

</div>


<div id="mobileControls">

    <button class="mobileButton" id="left">◀</button>
    <button class="mobileButton" id="right">▶</button>
    <button class="mobileButton" id="forward">▲</button>
    <button class="mobileButton" id="back">▼</button>

    <button class="mobileButton" id="fire">
        🔫
    </button>

</div>


<script type="importmap">
{
  "imports":{
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

    "three/addons/":
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let player;

let enemies=[];
let bullets=[];
let buildings=[];
let trees=[];

let gameRunning=false;
let dead=false;

let health=100;
let armor=100;

let kills=0;

let magazine=30;
let reserveAmmo=120;

let speed=.16;

let keys={};

let mouseX=0;
let mouseY=0;

let shooting=false;

let lastShot=0;

let zoneRadius=48;

const worldSize=120;


/* =========================================================
   SCENE
========================================================= */

function init(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(0x8fc7ef);

    scene.fog=
        new THREE.Fog(
            0x8fc7ef,
            45,
            170
        );


    camera=new THREE.PerspectiveCamera(
        68,
        innerWidth/innerHeight,
        .1,
        500
    );


    renderer=
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled=true;

    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;

    renderer.outputColorSpace=
        THREE.SRGBColorSpace;

    document.body.appendChild(
        renderer.domElement
    );


    createLighting();

    createIsland();

    createRoads();

    createCity();

    createNature();

    createPlayer();

    createEnemies();

    createZone();

    createWeapon();


    window.addEventListener(
        "resize",
        resize
    );

    setupControls();
}


/* =========================================================
   LIGHTING
========================================================= */

function createLighting(){

    const skyLight=
        new THREE.HemisphereLight(
            0xbfe7ff,
            0x30452b,
            2.2
        );

    scene.add(skyLight);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            3.5
        );

    sun.position.set(
        -40,
        70,
        25
    );

    sun.castShadow=true;

    sun.shadow.mapSize.width=2048;
    sun.shadow.mapSize.height=2048;

    sun.shadow.camera.left=-80;
    sun.shadow.camera.right=80;
    sun.shadow.camera.top=80;
    sun.shadow.camera.bottom=-80;

    scene.add(sun);
}


/* =========================================================
   ISLAND
========================================================= */

function createIsland(){

    const ground=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                worldSize,
                worldSize,
                80,
                80
            ),

            new THREE.MeshStandardMaterial({
                color:0x477b3d,
                roughness:.95
            })
        );


    ground.rotation.x=
        -Math.PI/2;

    ground.receiveShadow=true;

    scene.add(ground);


    const water=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                300,
                300
            ),

            new THREE.MeshStandardMaterial({
                color:0x1686b5,
                roughness:.2,
                metalness:.1
            })
        );


    water.rotation.x=
        -Math.PI/2;

    water.position.y=-.15;

    scene.add(water);
}


/* =========================================================
   ROADS
========================================================= */

function createRoads(){

    const material=
        new THREE.MeshStandardMaterial({
            color:0x24272a,
            roughness:.85
        });


    const roads=[
        [12,.1,110],
        [110,.1,12],
        [30,.1,110]
    ];


    for(const r of roads){

        const road=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    r[0],
                    r[1],
                    r[2]
                ),
                material
            );

        road.position.y=.03;

        road.receiveShadow=true;

        scene.add(road);
    }


    const lineMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffffff
        });


    for(
        let z=-52;
        z<55;
        z+=7
    ){

        const line=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .22,
                    .06,
                    3
                ),
                lineMaterial
            );

        line.position.set(
            0,
            .12,
            z
        );

        scene.add(line);
    }
}


/* =========================================================
   CITY
========================================================= */

function createCity(){

    for(
        let i=0;
        i<38;
        i++
    ){

        const x=
            (Math.random()-.5)*105;

        const z=
            (Math.random()-.5)*105;


        if(
            Math.abs(x)<12 ||
            Math.abs(z)<12
        ){
            continue;
        }


        const width=
            5+Math.random()*8;

        const depth=
            5+Math.random()*8;

        const height=
            4+Math.random()*16;


        const material=
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color(
                        .28+
                        Math.random()*.25,

                        .28+
                        Math.random()*.25,

                        .30+
                        Math.random()*.25
                    ),

                roughness:.72
            });


        const building=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width,
                    height,
                    depth
                ),
                material
            );


        building.position.set(
            x,
            height/2,
            z
        );


        building.castShadow=true;

        building.receiveShadow=true;

        scene.add(building);

        buildings.push(building);


        /* WINDOWS */

        for(
            let y=2;
            y<height-1;
            y+=2
        ){

            for(
                let wx=-width/2+1;
                wx<width/2;
                wx+=2
            ){

                const windowMesh=
                    new THREE.Mesh(

                        new THREE.PlaneGeometry(
                            .8,
                            .8
                        ),

                        new THREE.MeshBasicMaterial({
                            color:
                                Math.random()>.35
                                ?0x8edcff
                                :0x20282e
                        })
                    );


                windowMesh.position.set(
                    x+wx,
                    y,
                    z-depth/2-.01
                );

                scene.add(windowMesh);
            }
        }
    }
}


/* =========================================================
   TREES
========================================================= */

function createNature(){

    for(
        let i=0;
        i<65;
        i++
    ){

        const x=
            (Math.random()-.5)*110;

        const z=
            (Math.random()-.5)*110;


        if(
            Math.abs(x)<15 ||
            Math.abs(z)<15
        ){
            continue;
        }


        const group=
            new THREE.Group();


        const trunk=
            new THREE.Mesh(

                new THREE.CylinderGeometry(
                    .22,
                    .32,
                    2.2,
                    8
                ),

                new THREE.MeshStandardMaterial({
                    color:0x69452b
                })
            );


        trunk.position.y=1.1;


        const leaves=
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    1.6,
                    12,
                    10
                ),

                new THREE.MeshStandardMaterial({
                    color:0x1d632a,
                    roughness:.9
                })
            );


        leaves.position.y=3;


        group.add(
            trunk,
            leaves
        );


        group.position.set(
            x,
            0,
            z
        );


        group.castShadow=true;

        scene.add(group);

        trees.push(group);
    }
}


/* =========================================================
   PLAYER
========================================================= */

function createPlayer(){

    player=
        new THREE.Group();


    /*
       High-detail procedural character.

       A real GLB/GLTF human model can replace this
       character later without changing the game system.
    */


    const skin=
        new THREE.MeshStandardMaterial({
            color:0xc98562,
            roughness:.75
        });


    const clothing=
        new THREE.MeshStandardMaterial({
            color:0x1c2d42,
            roughness:.65
        });


    const pants=
        new THREE.MeshStandardMaterial({
            color:0x16191d,
            roughness:.8
        });


    const torso=
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .42,
                .85,
                8,
                16
            ),
            clothing
        );


    torso.position.y=1.35;

    torso.castShadow=true;

    player.add(torso);


    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                24,
                20
            ),
            skin
        );


    head.position.y=2.35;

    head.castShadow=true;

    player.add(head);


    const neck=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .15,
                .15,
                .25,
                12
            ),
            skin
        );


    neck.position.y=1.95;

    player.add(neck);


    createLimb(
        player,
        -.48,
        1.35,
        0,
        .16,
        .9,
        clothing
    );

    createLimb(
        player,
        .48,
        1.35,
        0,
        .16,
        .9,
        clothing
    );


    createLimb(
        player,
        -.2,
        .55,
        0,
        .18,
        .9,
        pants
    );

    createLimb(
        player,
        .2,
        .55,
        0,
        .18,
        .9,
        pants
    );


    player.position.set(
        0,
        0,
        20
    );


    scene.add(player);
}


function createLimb(
    parent,
    x,
    y,
    z,
    radius,
    length,
    material
){

    const limb=
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                radius,
                length,
                6,
                10
            ),
            material
        );


    limb.position.set(
        x,
        y,
        z
    );


    limb.castShadow=true;

    parent.add(limb);
}


/* =========================================================
   WEAPON
========================================================= */

function createWeapon(){

    const gun=
        new THREE.Group();


    const metal=
        new THREE.MeshStandardMaterial({
            color:0x18191a,
            metalness:.75,
            roughness:.25
        });


    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                .2,
                1.3
            ),
            metal
        );


    body.position.set(
        .55,
        1.45,
        -.5
    );


    gun.add(body);


    const barrel=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .06,
                .06,
                .8,
                12
            ),
            metal
        );


    barrel.rotation.x=
        Math.PI/2;


    barrel.position.set(
        .55,
        1.45,
        -1.35
    );


    gun.add(barrel);


    player.add(gun);
}


/* =========================================================
   ENEMIES
========================================================= */

function createEnemies(){

    for(
        let i=0;
        i<19;
        i++
    ){

        createEnemy();
    }
}


function createEnemy(){

    const enemy=
        new THREE.Group();


    const skin=
        new THREE.MeshStandardMaterial({
            color:0xb66e52,
            roughness:.8
        });


    const clothing=
        new THREE.MeshStandardMaterial({
            color:
                new THREE.Color(
                    .2+
                    Math.random()*.4,

                    .15+
                    Math.random()*.35,

                    .12+
                    Math.random()*.3
                ),

            roughness:.7
        });


    const torso=
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .43,
                .85,
                8,
                16
            ),
            clothing
        );


    torso.position.y=1.35;


    const head=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .38,
                20,
                16
            ),
            skin
        );


    head.position.y=2.35;


    enemy.add(
        torso,
        head
    );


    enemy.userData.health=100;


    let x;
    let z;


    do{

        x=
            (Math.random()-.5)*90;

        z=
            (Math.random()-.5)*90;

    }while(
        Math.hypot(
            x-player.position.x,
            z-player.position.z
        )<15
    );


    enemy.position.set(
        x,
        0,
        z
    );


    enemy.castShadow=true;


    scene.add(enemy);

    enemies.push(enemy);
}


/* =========================================================
   SHOOTING
========================================================= */

function shoot(){

    if(
        !gameRunning ||
        dead
    ){
        return;
    }


    const now=
        performance.now();


    if(
        now-lastShot<
        130
    ){
        return;
    }


    if(
        magazine<=0
    ){

        reload();

        return;
    }


    lastShot=now;

    magazine--;


    const direction=
        new THREE.Vector3();


    camera.getWorldDirection(
        direction
    );


    const bullet=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .055,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color:0xffd94a
            })
        );


    bullet.position.copy(
        camera.position
    );


    bullet.userData.velocity=
        direction.multiplyScalar(
            1.7
        );


    bullet.userData.life=80;


    scene.add(bullet);

    bullets.push(bullet);


    updateHUD();
}


function reload(){

    if(
        reserveAmmo<=0 ||
        magazine>=30
    ){
        return;
    }


    const amount=
        Math.min(
            30-magazine,
            reserveAmmo
        );


    magazine+=amount;

    reserveAmmo-=amount;

    updateHUD();
}


/* =========================================================
   BULLETS
========================================================= */

function updateBullets(){

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=
            bullets[i];


        b.position.add(
            b.userData.velocity
        );


        b.userData.life--;


        let hit=false;


        for(
            let j=enemies.length-1;
            j>=0;
            j--
        ){

            const enemy=
                enemies[j];


            if(
                b.position.distanceTo(
                    enemy.position
                )<1.3
            ){

                enemy.userData.health-=35;

                hit=true;


                if(
                    enemy.userData.health<=0
                ){

                    scene.remove(enemy);

                    enemies.splice(
                        j,
                        1
                    );

                    kills++;

                    setTimeout(
                        createEnemy,
                        1200
                    );
                }


                break;
            }
        }


        if(hit){

            scene.remove(b);

            bullets.splice(
                i,
                1
            );

            continue;
        }


        if(
            b.userData.life<=0
        ){

            scene.remove(b);

            bullets.splice(
                i,
                1
            );
        }
    }
}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

    for(
        const enemy of enemies
    ){

        const dx=
            player.position.x-
            enemy.position.x;

        const dz=
            player.position.z-
            enemy.position.z;


        const distance=
            Math.hypot(
                dx,
                dz
            );


        if(
            distance>7
        ){

            enemy.position.x+=
                dx/distance*
                .018;

            enemy.position.z+=
                dz/distance*
                .018;

            enemy.lookAt(
                player.position.x,
                1,
                player.position.z
            );
        }
        else{

            /*
              Enemy attacks when close.
            */

            if(
                Math.random()<.025
            ){

                damagePlayer(
                    4
                );
            }
        }
    }
}


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(){

    if(
        !gameRunning ||
        dead
    ){
        return;
    }


    let x=0;
    let z=0;


    if(
        keys.w ||
        keys.ArrowUp
    ){
        z-=1;
    }


    if(
        keys.s ||
        keys.ArrowDown
    ){
        z+=1;
    }


    if(
        keys.a ||
        keys.ArrowLeft
    ){
        x-=1;
    }


    if(
        keys.d ||
        keys.ArrowRight
    ){
        x+=1;
    }


    if(
        x!==0 ||
        z!==0
    ){

        const length=
            Math.hypot(
                x,
                z
            );


        x/=length;
        z/=length;


        player.position.x+=
            x*speed;

        player.position.z+=
            z*speed;


        player.rotation.y=
            Math.atan2(
                x,
                z
            );
    }


    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -55,
            55
        );


    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -55,
            55
        );


    updateCamera();
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const desired=
        new THREE.Vector3(
            player.position.x,
            player.position.y+4.2,
            player.position.z+7
        );


    camera.position.lerp(
        desired,
        .12
    );


    camera.lookAt(
        player.position.x,
        player.position.y+1.4,
        player.position.z
    );
}


/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(
    amount
){

    if(dead)
        return;


    if(armor>0){

        const absorbed=
            Math.min(
                armor,
                amount*.6
            );

        armor-=absorbed;

        amount-=absorbed;
    }


    health-=amount;


    if(
        health<=0
    ){

        health=0;

        die();
    }


    updateHUD();
}


function die(){

    dead=true;

    gameRunning=false;

    document.getElementById(
        "finalKills"
    ).textContent=kills;

    document.getElementById(
        "gameover"
    ).style.display="flex";
}


/* =========================================================
   SAFE ZONE
========================================================= */

function createZone(){

    const geometry=
        new THREE.RingGeometry(
            0,
            1,
            96
        );


    const material=
        new THREE.MeshBasicMaterial({
            color:0x22aaff,
            transparent:true,
            opacity:.16,
            side:THREE.DoubleSide
        });


    const zone=
        new THREE.Mesh(
            geometry,
            material
        );


    zone.rotation.x=
        -Math.PI/2;


    zone.position.y=.08;


    zone.scale.set(
        48,
        48,
        48
    );


    scene.add(zone);


    window.zoneMesh=zone;
}


function updateZone(){

    if(
        !gameRunning
    ){
        return;
    }


    zoneRadius-=.002;


    if(
        zoneRadius<15
    ){
        zoneRadius=15;
    }


    if(
        window.zoneMesh
    ){

        window.zoneMesh.scale.set(
            zoneRadius,
            zoneRadius,
            zoneRadius
        );
    }


    const distance=
        Math.hypot(
            player.position.x,
            player.position.z
        );


    if(
        distance>zoneRadius
    ){

        damagePlayer(
            .035
        );
    }


    document.getElementById(
        "zoneText"
    ).textContent=
        Math.round(
            zoneRadius/48*100
        )+"%";
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "health"
    ).style.width=
        health+"%";


    document.getElementById(
        "armor"
    ).style.width=
        armor+"%";


    document.getElementById(
        "kills"
    ).textContent=
        kills;


    document.getElementById(
        "alive"
    ).textContent=
        enemies.length+1;


    document.getElementById(
        "mag"
    ).textContent=
        magazine;
}


/* =========================================================
   CONTROLS
========================================================= */

function setupControls(){

    window.addEventListener(
        "keydown",
        e=>{

            keys[e.key]=true;


            if(
                e.key.toLowerCase()==="r"
            ){
                reload();
            }
        }
    );


    window.addEventListener(
        "keyup",
        e=>{
            keys[e.key]=false;
        }
    );


    renderer.domElement.addEventListener(
        "mousedown",
        ()=>{
            shooting=true;
            shoot();
        }
    );


    window.addEventListener(
        "mouseup",
        ()=>{
            shooting=false;
        }
    );


    window.addEventListener(
        "mousemove",
        e=>{

            if(
                document.pointerLockElement===
                renderer.domElement
            ){

                player.rotation.y-=
                    e.movementX*.0025;
            }
        }
    );


    renderer.domElement.addEventListener(
        "click",
        ()=>{

            if(
                gameRunning &&
                document.pointerLockElement!==
                renderer.domElement
            ){

                renderer.domElement.requestPointerLock();
            }
        }
    );


    mobileHold(
        "forward",
        "w"
    );

    mobileHold(
        "back",
        "s"
    );

    mobileHold(
        "left",
        "a"
    );

    mobileHold(
        "right",
        "d"
    );


    document.getElementById(
        "fire"
    ).addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            shoot();
        }
    );
}


function mobileHold(
    id,
    key
){

    const button=
        document.getElementById(id);


    button.addEventListener(
        "pointerdown",
        e=>{
            e.preventDefault();
            keys[key]=true;
        }
    );


    button.addEventListener(
        "pointerup",
        e=>{
            e.preventDefault();
            keys[key]=false;
        }
    );


    button.addEventListener(
        "pointercancel",
        ()=>{
            keys[key]=false;
        }
    );
}


/* =========================================================
   START / RESTART
========================================================= */

document.getElementById(
    "startButton"
).onclick=()=>{

    gameRunning=true;

    document.getElementById(
        "start"
    ).style.display="none";

    animate();
};


document.getElementById(
    "restart"
).onclick=()=>{

    location.reload();
};


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/
        innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
        innerWidth,
        innerHeight
    );
}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(
        !gameRunning
    ){

        renderer.render(
            scene,
            camera
        );

        return;
    }


    updatePlayer();

    updateEnemies();

    updateBullets();

    updateZone();


    if(shooting){

        shoot();
    }


    updateHUD();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

init();

updateHUD();

</script>

</body>
</html>
