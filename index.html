<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Battle Arena 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}
.panel{background:#0009;color:white;padding:9px 12px;border-radius:12px;border:1px solid #ffffff33}
#healthbar{width:190px;height:11px;background:#333;border-radius:8px;margin-top:5px;overflow:hidden}
#health{height:100%;width:100%;background:#25dc62}
#ammo{font-size:20px;font-weight:bold}
#cross{position:fixed;left:50%;top:50%;width:26px;height:26px;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}
#cross:before{left:12px;top:0;width:2px;height:26px}#cross:after{left:0;top:12px;width:26px;height:2px}
.joy{position:absolute;bottom:30px;width:140px;height:140px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff44;z-index:10;pointer-events:auto}
#moveJoy{left:25px}#aimJoy{right:25px}
.stick{position:absolute;left:50%;top:50%;width:62px;height:62px;transform:translate(-50%,-50%);border-radius:50%;background:#ffffff55;border:2px solid #ffffff88}
.action{position:absolute;z-index:11;border-radius:50%;color:white;font-weight:900;border:2px solid white;box-shadow:0 5px 16px #0008;pointer-events:auto}
#fire{right:40px;bottom:205px;width:108px;height:108px;font-size:28px;background:radial-gradient(circle,#ff7070,#d00000 60%,#700)}
#reload{right:165px;bottom:115px;width:65px;height:65px;font-size:11px;background:#17639bdd}
#tip{position:fixed;bottom:7px;left:50%;transform:translateX(-50%);z-index:5;background:#0008;color:#ddd;border-radius:9px;padding:5px 9px;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div class="panel">PLAYER<div id="healthbar"><div id="health"></div></div></div><div class="panel" id="ammo">30 / 90</div></div>
<div id="cross"></div>
<div class="joy" id="moveJoy"><div class="stick" id="moveStick"></div></div>
<div class="joy" id="aimJoy"><div class="stick" id="aimStick"></div></div>
<button class="action" id="fire">FIRE</button>
<button class="action" id="reload">RELOAD</button>
<div id="tip">PC: WASD move • Mouse aim • Left click fire • R reload</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b6ca);
scene.fog=new THREE.Fog(0x91b6ca,70,220);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById("game").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd8eeff,0x4a6b43,1.7));
const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(45,90,25);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);scene.add(sun);

const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,360),M(0x5f914b));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function box(x,y,z,a,b,c,m){
 const q=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;scene.add(q);return q;
}
const road=M(0x30343a),white=M(0xe8e4d5),wall=M(0xb9a68e),roof=M(0x563d32);
box(0,.03,0,360,.06,14,road);box(0,.04,0,14,.06,360,road);
for(let i=-170;i<=170;i+=10){box(i,.08,0,5,.03,.18,white);box(0,.08,i,.18,.03,5,white)}
function building(x,z,w,d,h){
 box(x,h/2,z,w,h,d,wall);box(x,h+.15,z,w+.3,d+.3,.3,roof);
 for(let xx=x-w/2+3;xx<x+w/2-2;xx+=5)for(let yy=3;yy<h-1;yy+=4)box(xx,yy,z-d/2-.04,.9,1.2,.08,white);
}
building(-32,-26,18,15,9);building(30,30,22,17,12);building(-48,42,14,20,8);building(54,-52,20,14,10);

function tree(x,z){
 box(x,2,z,1.2,4,1.2,M(0x70482e));
 const c=new THREE.Mesh(new THREE.SphereGeometry(3.7,14,10),M(0x245b31));c.position.set(x,6,z);c.castShadow=true;scene.add(c);
}
for(let i=0;i<65;i++){let x=(Math.random()-.5)*310,z=(Math.random()-.5)*310;if(Math.abs(x)<22||Math.abs(z)<22)continue;tree(x,z)}

function human(color){
 const g=new THREE.Group(), body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.35,6,12),M(color)), head=new THREE.Mesh(new THREE.SphereGeometry(.47,16,12),M(0xd19a78)), helmet=new THREE.Mesh(new THREE.SphereGeometry(.5,16,8,0,Math.PI*2,0,Math.PI*.55),M(0x252a30));
 body.position.y=1.45;head.position.y=2.65;helmet.position.y=2.82;
 [body,head,helmet].forEach(o=>{o.castShadow=true;g.add(o)});return g;
}
const player=human(0x2569d8);player.position.set(0,0,18);scene.add(player);
const enemies=[];
for(let i=0;i<10;i++){const e=human(0xb52c2c);e.position.set((Math.random()-.5)*150,0,(Math.random()-.5)*150);if(e.position.length()<30)e.position.x+=45;e.userData={hp:100,dead:false,speed:.018+Math.random()*.012};scene.add(e);enemies.push(e)}

let hp=100,ammo=30,reserve=90,reloading=false,yaw=0,pitch=-.18,firing=false,lastShot=0;
const keys={},bullets=[];
function hud(){document.getElementById("health").style.width=hp+"%";document.getElementById("ammo").textContent=ammo+" / "+reserve}
function reload(){if(reloading||ammo===30||reserve<=0)return;reloading=true;setTimeout(()=>{let n=Math.min(30-ammo,reserve);ammo+=n;reserve-=n;reloading=false;hud()},850)}
function shoot(){
 if(reloading)return;if(ammo<=0){reload();return}ammo--;hud();
 const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch,yaw,0,"YXZ"));
 const b=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),M(0xffd34d));b.position.copy(player.position).add(new THREE.Vector3(0,1.6,0)).add(dir);b.userData={dir,life:0};scene.add(b);bullets.push(b);
}
document.getElementById("fire").onpointerdown=e=>{e.preventDefault();e.stopPropagation();shoot()};
document.getElementById("reload").onpointerdown=e=>{e.preventDefault();e.stopPropagation();reload()};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==="r")reload()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
renderer.domElement.onpointerdown=e=>{if(e.pointerType==="mouse"&&e.button===0)firing=true};
addEventListener("pointerup",e=>{if(e.pointerType==="mouse")firing=false});
addEventListener("mousemove",e=>{if(e.buttons===1){yaw-=e.movementX*.0028;pitch-=e.movementY*.0022;pitch=Math.max(-1,Math.min(.55,pitch))}});

function joystick(zone,stick,cb){
 let id=null,max=48;
 function move(e){const r=zone.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y);if(l>max){x=x/l*max;y=y/l*max}stick.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;cb(x/max,y/max)}
 zone.onpointerdown=e=>{id=e.pointerId;zone.setPointerCapture(id);move(e)};
 zone.onpointermove=e=>{if(e.pointerId===id)move(e)};
 zone.onpointerup=zone.onpointercancel=e=>{if(e.pointerId===id){id=null;stick.style.transform="translate(-50%,-50%)";cb(0,0)}};
}
let mv={x:0,y:0};
joystick(document.getElementById("moveJoy"),document.getElementById("moveStick"),(x,y)=>mv={x,y});
joystick(document.getElementById("aimJoy"),document.getElementById("aimStick"),(x,y)=>{if(Math.abs(x)>.05)yaw-=x*.055;if(Math.abs(y)>.05)pitch-=y*.035;pitch=Math.max(-1,Math.min(.55,pitch))});

const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);
 let x=mv.x,y=mv.y;if(keys.a)x=-1;if(keys.d)x=1;if(keys.w)y=-1;if(keys.s)y=1;
 const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 player.position.add(f.multiplyScalar(-y*.13)).add(r.multiplyScalar(x*.13));player.position.x=THREE.MathUtils.clamp(player.position.x,-145,145);player.position.z=THREE.MathUtils.clamp(player.position.z,-145,145);player.rotation.y=yaw;
 if(firing&&performance.now()-lastShot>120){shoot();lastShot=performance.now()}
 for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.position.addScaledVector(b.userData.dir,.9);b.userData.life+=dt;let hit=false;
  for(const e of enemies)if(!e.userData.dead&&b.position.distanceTo(e.position.clone().add(new THREE.Vector3(0,1.4,0)))<1.5){e.userData.hp-=34;hit=true;if(e.userData.hp<=0){e.userData.dead=true;e.visible=false}break}
  if(hit||b.userData.life>1.7){scene.remove(b);bullets.splice(i,1)}
 }
 for(const e of enemies)if(!e.userData.dead){const v=player.position.clone().sub(e.position);v.y=0;const d=v.length();if(d<55){v.normalize();e.position.addScaledVector(v,e.userData.speed);e.lookAt(player.position.x,e.position.y+1,player.position.z);if(d<4&&Math.random()<.006){hp=Math.max(0,hp-3);hud()}}}
 const off=new THREE.Vector3(0,4.4,7.8).applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.lerp(player.position.clone().add(off),.12);
 const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch,yaw,0,"YXZ"));camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.5,0)).add(dir.multiplyScalar(20)));
 renderer.render(scene,camera);
}
hud();loop();
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
